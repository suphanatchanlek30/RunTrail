# Render Blueprint — RunTrail backend (free plan)
# ขั้นตอนเต็ม: docs/DEPLOY_RENDER.md
#
# Render Dashboard → New → Blueprint → เลือก repo นี้ → Render อ่านไฟล์นี้ แล้วถามค่าที่มี `sync: false`
# (ค่าความลับ ไม่เก็บใน git) · JWT_SECRET สุ่มให้อัตโนมัติ (256 บิต base64)
# ฐานข้อมูลและรูปอยู่ที่ Neon (Postgres + Object Storage) · ไม่ใช้ Postgres/ดิสก์ของ Render

services:
  - type: web
    name: runtrail-api              # → https://runtrail-api.onrender.com (ถ้าชื่อซ้ำ Render จะต่อท้ายให้ ต้องแก้ PUBLIC_BASE_URL ตาม)
    runtime: docker
    plan: free
    region: singapore               # เปลี่ยนภายหลังไม่ได้
    branch: main
    autoDeployTrigger: commit
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - backend/**                # deploy ใหม่เฉพาะเมื่อโค้ด backend เปลี่ยน
    envVars:
      # ---- ตั้งให้แล้ว
      - key: PUBLIC_BASE_URL
        value: https://runtrail-api.onrender.com
      - key: S3_REGION               # Neon Object Storage (Singapore)
        value: ap-southeast-1
      - key: S3_BUCKET
        value: runtrail-photos
      - key: S3_PATH_STYLE
        value: "true"
      - key: S3_CREATE_BUCKET        # bucket สร้างด้วย `neon bucket create runtrail-photos` · กุญแจของ Neon ไม่ต้องมีสิทธิ์สร้าง bucket
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: PROXY_HEADER            # IP จริงของผู้ใช้จาก proxy ของ Render → rate limit แยกต่อคน
        value: X-Forwarded-For
      - key: JWT_SECRET
        generateValue: true
      # ---- ใส่เองตอนสร้าง Blueprint (Render ถามครั้งแรกครั้งเดียว)
      - key: DATABASE_URL            # Neon, แบบ direct (ไม่มี -pooler) และมี ?sslmode=require
        sync: false
      - key: S3_ENDPOINT             # Neon: AWS_ENDPOINT_URL_S3 (https://br-xxxx.storage.c-4.ap-southeast-1.aws.neon.tech)
        sync: false
      - key: S3_ACCESS_KEY           # Neon: AWS_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_KEY           # Neon: AWS_SECRET_ACCESS_KEY
        sync: false
